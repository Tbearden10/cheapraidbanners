name = "cheapraidbanners"
compatibility_date = "2025-10-25"
main = "src/index.ts"
account_id = "5e7fb995b74586d322a72a99770b31dc"

# ===== CORE SETTINGS =====
[vars]
ENVIRONMENT = "production"
BUNGIE_CLAN_ID = "5335552"

# ===== D1 DATABASE =====
[[d1_databases]]
binding = "DB"
database_name = "clan-stats"
database_id = "b1e78f39-6cba-4c21-a822-95e4634d6370"

# ===== QUEUE CONFIGURATION =====

# Member queue: processes one member at a time
[[queues.producers]]
binding = "MEMBER_STATS_QUEUE"
queue = "member-stats-queue"

[[queues.consumers]]
queue = "member-stats-queue"
max_batch_size = 1              # Process 1 member at a time
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "member-stats-dlq"
max_concurrency = 1

# Stats queue: processes batches of 50 PGCRs
[[queues.producers]]
binding = "STATS_QUEUE"
queue = "stats-queue"

[[queues.consumers]]
queue = "stats-queue"
max_batch_size = 1              # Process 1 batch (of 50 PGCRs) at a time
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "stats-dlq"
max_concurrency = 1


# ===== WORKER LIMITS =====
[limits]
cpu_ms = 300000

# ===== CRON TRIGGERS =====
[triggers]
crons = [
  "0 * * * *",      # Member sync: Every hour at minute 0
  "0 19 * * *",     # Stats sync: Every day at 12 PM MST (19:00 UTC)
]

# ===== ROUTES =====
[[routes]]
pattern = "api.cheapraidbanners.com/*"
zone_name = "cheapraidbanners.com"

# ===== DEVELOPMENT ENVIRONMENT =====
[env.dev]
[env.dev.vars]
ENVIRONMENT = "dev"
BUNGIE_CLAN_ID = "5335552"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "clan-stats-local"
database_id = "fe0acf69-ffd3-4c6c-879f-f928ecec0f2c"

[[env.dev.queues.producers]]
binding = "MEMBER_STATS_QUEUE"
queue = "member-stats-queue-local"

[[env.dev.queues.consumers]]
queue = "member-stats-queue-local"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "member-stats-dlq-local"

[[env.dev.queues.producers]]
binding = "STATS_QUEUE"
queue = "stats-queue-local"

[[env.dev.queues.consumers]]
queue = "stats-queue-local"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "stats-dlq-local"

