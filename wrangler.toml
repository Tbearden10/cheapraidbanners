name = "cheapraidbanners"
compatibility_date = "2025-10-25"
main = "src/index.ts"
account_id = "5e7fb995b74586d322a72a99770b31dc"

# Environment variables - tuning knobs for concurrency and throttling
[vars]

# Concurrency & batching knobs (tune these without changing code)
BUNGIE_FETCH_CONCURRENCY = "8"
BATCH_PROCESS_CONCURRENCY = "5"
QUEUE_PROCESS_CONCURRENCY = "5"
QUEUE_SEND_CONCURRENCY = "6"
BATCH_SIZE = "25"
PREFETCH_BATCH_WINDOW = "2"
MAX_PREFETCH_ITEMS_PER_WINDOW = "200"
DUNGEON_PROCESS_CONCURRENCY = "2"
ENRICH_CONCURRENCY = "6"
MAX_RUN_ACTIVITIES = "5000"

# Bungie request tuning
BUNGIE_PER_REQUEST_TIMEOUT_MS = "12000"
BUNGIE_FETCH_RETRIES = "2"
BUNGIE_FETCH_BACKOFF_MS = "400"
DO_THRESHOLD = "1"
ACTIVITY_THRESHOLD = "100"

[[d1_databases]]
binding = "DB"
database_name = "clan-stats"
database_id = "b1e78f39-6cba-4c21-a822-95e4634d6370"

# Queue Binding - Member Stats Processing
[[queues.producers]]
binding = "MEMBER_STATS_QUEUE"
queue = "member-stats-queue"

[[queues.consumers]]
queue = "member-stats-queue"
max_batch_size = 8
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "member-stats-dlq"

# Durable Object bindings
[[durable_objects.bindings]]
name = "BATCH_COORDINATOR"
class_name = "BatchCoordinator"

[[durable_objects.bindings]]
name = "RUN_TRACKER"
class_name = "RunTracker"

[[migrations]]
tag = "v1"
new_classes = ["BatchCoordinator", "RunTracker"]

# Cron Triggers
[triggers]
crons = [
  "*/30 * * * *",    # Member sync (every 30 min)
  "0 */6 * * *"      # Stats sync (every 6 hours)
]

# Routes
[[routes]]
pattern = "api.cheapraidbanners.com/*"
zone_name = "cheapraidbanners.com"
