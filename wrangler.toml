name = "cheapraidbanners"
compatibility_date = "2025-10-25"
main = "src/index.ts"
account_id = "5e7fb995b74586d322a72a99770b31dc"

# Environment variables - Production-optimized settings
[vars]
# ===== CORE SETTINGS =====
ENVIRONMENT = "production"
# Set your clan id here (or via env secrets)
BUNGIE_CLAN_ID = "5335552"

# ===== D1 DATABASE =====
[[d1_databases]]
binding = "DB"
database_name = "clan-stats"
database_id = "b1e78f39-6cba-4c21-a822-95e4634d6370"

[[kv_namespaces]]
binding = "RUN_TRACKING_KV"
id = "34b7e40402a34f3584da2da2c66ae43c"

# ===== QUEUE CONFIGURATION =====
# Producer / consumer for member jobs
[[queues.producers]]
binding = "MEMBER_STATS_QUEUE"
queue = "member-stats-queue"

[[queues.consumers]]
queue = "member-stats-queue"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "member-stats-dlq"
max_concurrency = 1

# Producer / consumer for PGCR / stats jobs
[[queues.producers]]
binding = "STATS_QUEUE"
queue = "stats-queue"

[[queues.consumers]]
queue = "stats-queue"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "stats-dlq"
max_concurrency = 10

# ===== DURABLE OBJECTS =====
[[durable_objects.bindings]]
name = "BATCH_COORDINATOR"
class_name = "BatchCoordinator"

# ===== DURABLE OBJECT MIGRATIONS =====
[[migrations]]
tag = "v1"
new_classes = ["BatchCoordinator"]

# ===== CRON TRIGGERS =====
[triggers]
crons = [
  "*/30 * * * *",    # Member sync: every 30 minutes
  "0 */6 * * *"      # Stats sync: every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
]

# ===== ROUTES =====
[[routes]]
pattern = "api.cheapraidbanners.com/*"
zone_name = "cheapraidbanners.com"

[limits]
cpu_ms = 300000


# ===== OPTIONAL: Development Environment Override =====
[env.dev]
[env.dev.vars]
ENVIRONMENT = "dev"
BUNGIE_CLAN_ID = "5335552"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "clan-stats-local"
database_id = "fe0acf69-ffd3-4c6c-879f-f928ecec0f2c"

[[env.dev.kv_namespaces]]
binding = "RUN_TRACKING_KV"
id = "8c66598da19648ce945a39aee24da217"

[[env.dev.queues.producers]]
binding = "MEMBER_STATS_QUEUE"
queue = "member-stats-queue-local"

[[env.dev.queues.consumers]]
queue = "member-stats-queue-local"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "member-stats-dlq-local"

[[env.dev.queues.producers]]
binding = "STATS_QUEUE"
queue = "stats-queue-local"

[[env.dev.queues.consumers]]
queue = "stats-queue-local"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "stats-dlq-local"

# Durable Objects (same bindings, local instances)
[[env.dev.durable_objects.bindings]]
name = "BATCH_COORDINATOR"
class_name = "BatchCoordinator"
