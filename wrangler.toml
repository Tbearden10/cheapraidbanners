name = "cheapraidbanners"
compatibility_date = "2025-10-25"
main = "src/index.ts"
account_id = "5e7fb995b74586d322a72a99770b31dc"

# Environment variables - Production-optimized settings
[vars]
# ===== CORE SETTINGS =====
ENVIRONMENT = "production"
# Add these as secrets via: wrangler secret put BUNGIE_API_KEY
# Add these as secrets via: wrangler secret put API_TOKEN
# Add these as vars: BUNGIE_CLAN_ID = "your-clan-id"

# ===== CONCURRENCY SETTINGS =====
# Member sync (roster enrichment)
ENRICH_CONCURRENCY = "1"                  # Parallel emblem fetches during member sync

# Stats sync (queue management)
QUEUE_SEND_CONCURRENCY = "1"                # Parallel queue sends (members → queue)
QUEUE_PROCESS_CONCURRENCY = "1"             # Process 1 member at a time (SEQUENTIAL)
                                            # NOTE: Must match max_batch_size in [[queues.consumers]]

# Per-member processing
DUNGEON_PROCESSING_CONCURRENCY = "1"        # Process 5 dungeons in parallel per member

# PGCR verification (SEQUENTIAL like dungeon-info-hub)
PGCR_BATCH_SIZE = "30"                      # Items per batch to BatchCoordinator
PGCR_DELAY_MS = "50"                        # Delay between sequential PGCR requests (milliseconds)
PGCR_BATCH_CONCURRENCY = "2"

# ===== BUNGIE API SETTINGS =====
BUNGIE_PER_REQUEST_TIMEOUT_MS = "15000"     # 15s timeout per request
BUNGIE_FETCH_RETRIES = "3"                  # Retry attempts on failure
BUNGIE_FETCH_BACKOFF_MS = "400"             # Base backoff delay (exponential)

# ===== WORKER SELF-INVOCATION =====
# URL for internal queue dispatch. The queue handler uses this to dispatch
# each batch message to a new worker invocation via fetch.
WORKER_URL = "https://api.cheapraidbanners.com"

# ===== D1 DATABASE =====
[[d1_databases]]
binding = "DB"
database_name = "clan-stats"
database_id = "b1e78f39-6cba-4c21-a822-95e4634d6370"

# ===== QUEUE CONFIGURATION =====
# 
# Queue Processing Architecture:
# Each queue message represents a single member to process. The queue handler
# dispatches each message to a new worker invocation via the /internal/process-member
# endpoint. This ensures:
#
# - 100 batches → 100 workers → 100 new invocations
# - Each worker invocation handles exactly one member's stats processing
# - Avoids platform execution time limits by distributing work across invocations
# - Better resource isolation and fault tolerance per member
#
# The max_batch_size=1 ensures each message arrives as its own batch. Combined with
# max_concurrency, this controls how many parallel worker invocations can process
# members simultaneously.
#
[[queues.producers]]
binding = "MEMBER_STATS_QUEUE"
queue = "member-stats-queue"

[[queues.consumers]]
queue = "member-stats-queue"
max_batch_size = 1              # Each message arrives as its own batch for separate invocation
max_batch_timeout = 5           # Wait 5s to fill batch (minimal since batch_size=1)
max_retries = 3                 # Retry failed members 3 times
dead_letter_queue = "member-stats-dlq"
max_concurrency = 10            # Up to 10 parallel worker invocations processing members

# ===== DURABLE OBJECTS =====
[[durable_objects.bindings]]
name = "BATCH_COORDINATOR"
class_name = "BatchCoordinator"
# Used for: PGCR batch coordination and result aggregation

[[durable_objects.bindings]]
name = "RUN_TRACKER"
class_name = "RunTracker"
# Used for: Tracking stats sync completion and triggering aggregate recompute

# ===== DURABLE OBJECT MIGRATIONS =====
# Register DO classes with a migration so Cloudflare will create the classes.
# If you already have a migrations section, add a new [[migrations]] entry
# with an incremented tag (e.g. "v2") instead of reusing the same tag.
[[migrations]]
tag = "v1"
new_classes = ["BatchCoordinator", "RunTracker"]

# ===== CRON TRIGGERS =====
[triggers]
crons = [
  "*/30 * * * *",    # Member sync: every 30 minutes
  "0 */1 * * *"      # Stats sync: every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
]

# ===== ROUTES =====
[[routes]]
pattern = "api.cheapraidbanners.com/*"
zone_name = "cheapraidbanners.com"

# ===== OPTIONAL: Development Environment Override =====
[env.dev]
[env.dev.vars]
ENVIRONMENT = "dev"
ENRICH_CONCURRENCY = "1"
QUEUE_SEND_CONCURRENCY = "1"
QUEUE_PROCESS_CONCURRENCY = "1"
DUNGEON_PROCESSING_CONCURRENCY = "1"
PGCR_BATCH_SIZE = "30"
PGCR_DELAY_MS = "50"
PGCR_BATCH_CONCURRENCY = "1"
BUNGIE_PER_REQUEST_TIMEOUT_MS = "15000"
BUNGIE_FETCH_RETRIES = "3"
# Dev uses localhost for self-invocation
WORKER_URL = "http://localhost:8787"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "clan-stats-local"
database_id = "fe0acf69-ffd3-4c6c-879f-f928ecec0f2c"

[[env.dev.queues.producers]]
binding = "MEMBER_STATS_QUEUE"
queue = "member-stats-queue-local"

# Dev queue configuration mirrors production architecture:
# Each message dispatches to a new worker invocation via /internal/process-member
[[env.dev.queues.consumers]]
queue = "member-stats-queue-local"
max_batch_size = 1              # Each message arrives as its own batch
max_batch_timeout = 50
max_retries = 3
dead_letter_queue = "member-stats-dlq-local"

# Durable Objects (same bindings, local instances)
[[env.dev.durable_objects.bindings]]
name = "BATCH_COORDINATOR"
class_name = "BatchCoordinator"

[[env.dev.durable_objects.bindings]]
name = "RUN_TRACKER"
class_name = "RunTracker"